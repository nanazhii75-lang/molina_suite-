          n_old=$(grep -cxF -- "$old" "$f" || true)
          n_new=$(grep -cxF -- "$new" "$f" || true)
          if [ "$n_old" != "0" ] || [ "$n_new" != "1" ]; then
            echo "GAGAL: hasil patch tidak sesuai ($n_old dan $n_new)"
            exit 1
          fi
          bash -n "$f"
