          sha=$(bash -c 'set +u; source "$1" >/dev/null 2>&1; echo "$TERMUX_PKG_SHA256"' _ "$F")
          if [ -z "$url" ] || [ -z "$sha" ]; then echo "GAGAL: SRCURL atau SHA256 kosong"; exit 1; fi
          D=$(mktemp -d)
          curl -fsSL --retry 3 "$url" -o "$D/src.tgz" || { echo "GAGAL: unduh sumber termux-tools"; exit 1; }
