          if [ "$got" != "$sha" ]; then echo "GAGAL: SHA256 beda ($got)"; exit 1; fi
          mkdir "$D/s" && tar -xf "$D/src.tgz" -C "$D/s" --strip-components=1
          P="$D/s/scripts/pkg.in"
          [ -f "$P" ] || { echo "GAGAL: scripts/pkg.in tidak ada"; exit 1; }
          if grep -q "$(printf '\r')" "$P"; then echo "GAGAL: pkg.in CRLF"; exit 1; fi
          n_a=$(grep -c '^select_mirror() {$' "$P" || true)
          if [ "$n_a" != 1 ]; then echo "GAGAL: anchor select_mirror=$n_a (harus 1)"; exit 1; fi
          sed 's|@[A-Za-z_]*@|x|g' "$P" > "$D/base.sh"
          if bash -n "$D/base.sh" 2>/dev/null; then
            BASE_OK=1
          else
            BASE_OK=0
            echo "PERINGATAN: pkg.in asli tidak lolos bash -n setelah placeholder diganti; cek sintaks dilewati"
          fi
          sed -i '/^select_mirror() {$/r '"$G" "$P"
          n_g=$(grep -cF 'molina: repo resmi Termux' "$P" || true)
          if [ "$n_g" != 1 ]; then echo "GAGAL: penjaga masuk $n_g kali (harus 1)"; exit 1; fi
          if [ "$BASE_OK" = 1 ]; then
            sed 's|@[A-Za-z_]*@|x|g' "$P" > "$D/patched.sh"
            bash -n "$D/patched.sh" || { echo "GAGAL: pkg.in hasil patch tidak lolos bash -n"; exit 1; }
          fi
          { sed -n '/^select_mirror() {$/,/^    exit 1$/p' "$P"; echo '}'; echo 'select_mirror'; } > "$D/fn.sh"
          out=$(bash "$D/fn.sh" 2>&1); rc=$?
          echo "keluaran penjaga (rc=$rc):"
          echo "$out"
          if [ "$rc" != 1 ] || ! echo "$out" | grep -qF 'molina: repo apt molina belum tersedia'; then
            echo "GAGAL: penjaga tidak berperilaku seperti yang diharapkan"
