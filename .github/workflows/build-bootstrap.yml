          fi
          got=$(sha256sum /tmp/nano.tar.xz | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "GAGAL: hash beda got=$got want=$want, build.sh tidak ditambal"
            exit 1
          fi
          echo "COCOK  $url"
          echo "entri pertama arsip: $(tar -tJf /tmp/nano.tar.xz | head -1)"
