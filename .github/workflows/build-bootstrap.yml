          [ -d tp ] || { echo "GAGAL: direktori tp tidak ada"; exit 1; }
          cd tp
          for p in proot libtalloc proot-distro file; do
            f="packages/$p/build.sh"
            echo "=== $p"
            [ -f "$f" ] || { echo "TIDAK ADA: $f"; continue; }
            url=$(bash -c 'set +u; source "$1" >/dev/null 2>&1; echo "$TERMUX_PKG_SRCURL"' _ "$f")
            sha=$(bash -c 'set +u; source "$1" >/dev/null 2>&1; echo "$TERMUX_PKG_SHA256"' _ "$f")
            echo "SRCURL=$url"
            echo "SHA256 di build.sh=$sha"
            if [ -z "$url" ]; then echo "SRCURL kosong"; continue; fi
            rm -f /tmp/probe.src
            if curl -fsSL --retry 2 --max-time 180 "$url" -o /tmp/probe.src; then
              got=$(sha256sum /tmp/probe.src | cut -d' ' -f1)
              if [ "$got" = "$sha" ]; then echo "UNDUH OK, SHA256 COCOK"; else echo "UNDUH OK, SHA256 BEDA: unduhan=$got"; fi
            else
              echo "UNDUH GAGAL (kode curl $?)"
            fi
          done

      - name: Bangun image builder dari commit terpin
        if: ${{ inputs.build }}
        run: |
          docker build -t molina-package-builder:local tp/scripts

      - name: Verifikasi image builder
        if: ${{ inputs.build }}
        run: |
          docker run --rm molina-package-builder:local bash -c 'ls -d /home/builder/lib/android-ndk-r28c && ls -ld /data/data /data/data/*'

      - name: Siapkan container builder
        if: ${{ inputs.build }}
        run: |
          if [ "$(id -u)" != "1001" ]; then
            echo "GAGAL: uid runner $(id -u) bukan 1001; run-docker.sh biasanya menyesuaikan uid builder, container manual belum"
            exit 1
          fi
          docker run --detach --init --name termux-package-builder \
            --volume "$PWD/tp:/home/builder/termux-packages" \
            --security-opt "seccomp=$PWD/tp/scripts/profile.json" \
            --tty molina-package-builder:local
          docker ps --filter name=termux-package-builder --format '{{.Names}} {{.Status}}'

      - name: Pulihkan cache build (unduh)
        id: bscache
        if: ${{ inputs.build && inputs.use_cache }}
        uses: actions/cache/restore@v4
        with:
          path: bscache
          key: bsc-${{ env.CACHE_EPOCH }}-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bsc-${{ env.CACHE_EPOCH }}-${{ inputs.commit }}-

      - name: Pulihkan state ke container
        if: ${{ inputs.build && inputs.use_cache && steps.bscache.outputs.cache-matched-key != '' }}
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          ls -lh bscache
          if [ ! -f bscache/state.tar.zst ]; then
            echo "GAGAL: state.tar.zst tidak ada di cache"; exit 1
          fi
          zstd -dc bscache/state.tar.zst | docker exec -i termux-package-builder sudo tar -C / -xpf -
          if [ -f bscache/output.tar.zst ]; then
            zstd -dc bscache/output.tar.zst | tar -C tp -xpf -
          fi
          echo "CACHE_RESTORED=true" >> "$GITHUB_ENV"
          echo "=== paket bertanda selesai ==="
          docker exec termux-package-builder ls /data/data/.built-packages 2>/dev/null | head -60 || true

      - name: Hapus penanda built termux-tools (paksa bangun ulang)
        if: ${{ inputs.build }}
        run: |
          docker exec termux-package-builder sudo rm -f /data/data/.built-packages/termux-tools
          docker exec termux-package-builder sudo rm -rf /home/builder/.termux-build/termux-tools
          if docker exec termux-package-builder test -e /data/data/.built-packages/termux-tools; then
            echo "GAGAL: penanda termux-tools masih ada"
            exit 1
          fi
          echo "OK: penanda dan direktori build termux-tools dihapus"
          echo "=== paket bertanda selesai (seharusnya tanpa termux-tools) ==="
          docker exec termux-package-builder ls /data/data/.built-packages | head -60 || true

      - name: Hapus penanda built apt dan ncurses (paksa bangun ulang)
        if: ${{ inputs.build }}
        run: |
          for p in apt ncurses; do
            docker exec termux-package-builder sudo rm -f /data/data/.built-packages/$p
            docker exec termux-package-builder sudo rm -rf /home/builder/.termux-build/$p
            if docker exec termux-package-builder test -e /data/data/.built-packages/$p; then
              echo "GAGAL: penanda $p masih ada"
              exit 1
            fi
            echo "OK: penanda dan direktori build $p dihapus"
          done
          echo "=== paket bertanda selesai (seharusnya tanpa termux-tools, apt, ncurses) ==="
          docker exec termux-package-builder ls /data/data/.built-packages | head -60 || true

      - name: Build bootstrap aarch64
        if: ${{ inputs.build }}
        run: |
          cd tp
          (while sleep 600; do echo "== heartbeat $(date -u +%T) =="; tail -n 3 ../build.log; done) &
          HB=$!
          NOCLEAN=""
          if [ "${CACHE_RESTORED:-}" = "true" ]; then NOCLEAN="--no-clean"; fi
          echo "NOCLEAN='$NOCLEAN'"
          set +e
          TERMUX_BUILDER_IMAGE_NAME=molina-package-builder:local ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 --no-build-unneeded-subpackages --packages-pre-additional ncurses-utils --packages-post-additional proot,libtalloc,proot-distro,file $NOCLEAN &> ../build.log
          rc=$?
          kill $HB 2>/dev/null
          if [ $rc -ne 0 ]; then
            echo "GAGAL: build exit $rc; 80 baris terakhir:"
            tail -n 80 ../build.log
            exit $rc
          fi

      - name: Simpan state dari container
        id: bssave
        if: ${{ always() && inputs.build && inputs.use_cache }}
        run: |
          command -v zstd >/dev/null || sudo apt-get install -y -qq zstd
          if ! docker ps -q --filter name=termux-package-builder | grep -q .; then
            echo "container tidak berjalan; lewati penyimpanan"; exit 0
          fi
          rm -rf bscache && mkdir -p bscache
          docker exec termux-package-builder sudo tar -C / -cpf - data home/builder/.termux-build | zstd -T0 -3 -q -o bscache/state.tar.zst
          if [ -d tp/output ]; then
            tar -C tp -cpf - output | zstd -T0 -3 -q -o bscache/output.tar.zst
          fi
          du -sh bscache/*
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Simpan cache build (unggah)
        if: ${{ always() && inputs.build && inputs.use_cache && steps.bssave.outputs.saved == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: bscache
          key: bsc-${{ env.CACHE_EPOCH }}-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Diagnosa pasca-build
        if: ${{ always() && inputs.build }}
        continue-on-error: true
        run: |
          set +e
          echo "=== zip yang ada di tp ==="
          find tp -maxdepth 3 -name '*.zip' -printf '%p %s byte\n' 2>/dev/null
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          echo "ZIP=$ZIP"
          if [ -n "$ZIP" ]; then
            p=$(unzip -Z1 "$ZIP" | grep 'second-stage' | head -1)
            echo "=== berkas second-stage dalam zip: $p ==="
            unzip -p "$ZIP" "$p" | head -3
            echo "=== jumlah berkas dalam zip ==="
            unzip -Z1 "$ZIP" | wc -l
          fi
          echo "=== exit code atau error di build.log (30 terakhir) ==="
          grep -n -i "exited with exit code\|exit code\|Failed to\|ERROR" build.log | tail -30
          echo "=== 15 baris terakhir scripts/build-bootstraps.sh ==="
          tail -15 tp/scripts/build-bootstraps.sh
          echo "=== 25 baris terakhir scripts/run-docker.sh ==="
          tail -25 tp/scripts/run-docker.sh
          exit 0

      - name: Diagnosa isi bootstrap
        if: ${{ always() && inputs.build }}
        continue-on-error: true
        run: |
          set +e
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          [ -n "$ZIP" ] || { echo "zip tidak ada"; exit 0; }
          rm -rf /tmp/bz && mkdir -p /tmp/bz && unzip -q "$ZIP" -d /tmp/bz
          echo "=== semua berkas second-stage ==="
          (cd /tmp/bz && find . -name '*second-stage*' | sort)
          echo "=== shebang second-stage utama ==="
          head -3 /tmp/bz/etc/termux/bootstrap/termux-bootstrap-second-stage.sh
          echo "=== jumlah berkas yang memuat com.termux ==="
          grep -rIl 'com\.termux' /tmp/bz | wc -l
          echo "=== daftar berkas (30 pertama) ==="
          grep -rIl 'com\.termux' /tmp/bz | sed 's|/tmp/bz/||' | head -30
          echo "=== baris yang memuat com.termux (40 pertama) ==="
          grep -rIn 'com\.termux' /tmp/bz | sed 's|/tmp/bz/||' | head -40
          echo "=== SYMLINKS.txt ==="
          ls -la /tmp/bz/SYMLINKS.txt
          exit 0

      - name: Diagnosa sisa com.termux
        if: ${{ always() && inputs.build }}
        continue-on-error: true
        run: |
          set +e
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          [ -n "$ZIP" ] || { echo "zip tidak ada"; exit 0; }
          rm -rf /tmp/bz2 && mkdir -p /tmp/bz2 && unzip -q "$ZIP" -d /tmp/bz2
          echo "=== token unik yang memuat com.termux ==="
          grep -rIoh '[A-Za-z0-9_./@:-]*com\.termux[A-Za-z0-9_./@:-]*' /tmp/bz2 | sort | uniq -c | sort -rn | head -60
          echo "=== berkas dan jumlah baris ==="
          grep -rIc 'com\.termux' /tmp/bz2 | grep -v ':0$' | sed 's|/tmp/bz2/||' | sort
          echo "=== paket pemilik tiap berkas ==="
          P=/data/data/com.molina.suite/files/usr
          for f in $(grep -rIl 'com\.termux' /tmp/bz2 | sed 's|/tmp/bz2/||' | grep -v '^var/lib/dpkg'); do
            own=$(grep -lxF "$P/$f" /tmp/bz2/var/lib/dpkg/info/*.list | xargs -r -n1 basename | tr '\n' ' ')
            echo "$f -> $own"
          done
          echo "=== waktu build paket di container ==="
          docker exec termux-package-builder ls -l --time-style=full-iso /data/data/.built-packages 2>/dev/null | grep -E 'termux-tools|termux-exec|termux-am|termux-core|apt|bash'
          echo "=== packages/termux-tools ==="
          ls tp/packages/termux-tools
          grep -n "com.termux\|TERMUX_APP\|TERMUX_REPO\|@TERMUX" tp/packages/termux-tools/build.sh | head -40
          grep -rn "com\.termux" tp/packages/termux-tools 2>/dev/null | head -40
          echo "=== second-stage baru ==="
          ls -la /tmp/bz2/etc/termux/termux-bootstrap /tmp/bz2/etc/termux/termux-bootstrap/second-stage
          head -5 /tmp/bz2/etc/termux/termux-bootstrap/second-stage/termux-bootstrap-second-stage.sh
          exit 0

      - name: Diagnosa second-stage baru
        if: ${{ always() && inputs.build }}
        continue-on-error: true
        run: |
          set +e
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          [ -n "$ZIP" ] || { echo "zip tidak ada"; exit 0; }
          rm -rf /tmp/bz3 && mkdir -p /tmp/bz3 && unzip -q "$ZIP" -d /tmp/bz3
          echo "=== izin berkas second-stage di zip ==="
          unzip -Z "$ZIP" 'etc/termux/termux-bootstrap/*' 'etc/profile.d/01-*'
          echo "=== skrip fallback (maks 120 baris) ==="
          head -120 /tmp/bz3/etc/profile.d/01-termux-bootstrap-second-stage-fallback.sh
          echo "=== skrip second-stage (maks 150 baris) ==="
          head -150 /tmp/bz3/etc/termux/termux-bootstrap/second-stage/termux-bootstrap-second-stage.sh
          echo "=== isi direktori termux-bootstrap ==="
          find /tmp/bz3/etc/termux/termux-bootstrap -type f | sed 's|/tmp/bz3/||' | sort
          exit 0

      - name: Diagnosa komponen app di bootstrap
        if: ${{ always() && inputs.build }}
        continue-on-error: true
        run: |
          set +e
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          echo "ZIP=$ZIP"
          [ -n "$ZIP" ] || exit 0
          for f in bin/termux-wake-lock bin/termux-wake-unlock bin/termux-open bin/termux-reset bin/termux-reload-settings bin/termux-setup-storage; do
            echo "=== $f ==="
            unzip -p "$ZIP" "$f" | grep -n "com\.\(molina\|termux\)"
          done
          echo "=== bin/pkg ==="
          unzip -p "$ZIP" bin/pkg | grep -n "com\.\(molina\|termux\)" | head -25
          echo "=== bin/login ==="
          unzip -p "$ZIP" bin/login | grep -n "com\.\(molina\|termux\)" | head -15
          echo "=== bin/chsh ==="
          unzip -p "$ZIP" bin/chsh | grep -n "com\.\(molina\|termux\)" | head -10
          exit 0

      - name: Verifikasi hasil
        if: ${{ inputs.build }}
        run: |
          ZIP=$(find tp -maxdepth 2 -name 'bootstrap-aarch64.zip' | head -1)
          [ -n "$ZIP" ] || { echo "GAGAL: bootstrap-aarch64.zip tidak ditemukan"; exit 1; }
          cp "$ZIP" bootstrap-aarch64.zip
          sha256sum bootstrap-aarch64.zip | tee bootstrap-aarch64.zip.sha256
          ls -l bootstrap-aarch64.zip
          SHEBANG=$(unzip -p bootstrap-aarch64.zip etc/termux/termux-bootstrap/second-stage/termux-bootstrap-second-stage.sh | head -1)
          echo "Shebang second stage: $SHEBANG"
          case "$SHEBANG" in
            *"/data/data/$NEW_PKG/files/usr/bin/"*) echo "OK: shebang berprefix $NEW_PKG" ;;
            *) echo "GAGAL: shebang tidak berprefix $NEW_PKG"; exit 1 ;;
          esac
          mkdir x && cd x && unzip -q ../bootstrap-aarch64.zip
          echo "Berkas yang masih memuat com.termux (jumlah): $(grep -rlaF 'com.termux' . | wc -l)"
          grep -rlaF 'com.termux' . | head -20 || true
          # [molina] penjaga paket tambahan
          python3 - <<'PYV'
          import glob
          import re
          import sys
          from pathlib import Path

          REQUIRED = ["proot", "libtalloc", "proot-distro", "file", "ncurses-utils"]
          problems = []


          def paragraphs(text):
              for block in re.split(r"\n\s*\n", text):
                  fields = {}
                  key = None
                  for line in block.splitlines():
                      if line[:1] in (" ", "\t") and key:
                          fields[key] += "\n" + line.strip()
                      elif ":" in line:
                          key, _, val = line.partition(":")
                          key = key.strip()
                          fields[key] = val.strip()
                  if fields.get("Package"):
                      yield fields


          def dep_groups(field):
              for group in field.split(","):
                  alts = []
                  for alt in group.split("|"):
                      name = re.sub(r"\(.*?\)", "", alt).strip()
                      if name:
                          alts.append(name.split()[0].split(":")[0])
                  if alts:
                      yield alts


          status_path = Path("var/lib/dpkg/status")
          if not status_path.is_file():
              print("GAGAL: var/lib/dpkg/status tidak ada di zip")
              sys.exit(1)

          pkgs = {}
          provides = set()
          for f in paragraphs(status_path.read_text(encoding="utf-8", errors="replace")):
              st = f.get("Status", "").split()
              if st and st[-1] == "installed":
                  pkgs[f["Package"]] = f
                  for p in f.get("Provides", "").split(","):
                      p = p.strip()
                      if p:
                          provides.add(p.split()[0])
          print("Paket terpasang di status dpkg: %d" % len(pkgs))


          def unmet(name):
              out = []
              for field in ("Pre-Depends", "Depends"):
                  for alts in dep_groups(pkgs[name].get(field, "")):
                      if not any(a in pkgs or a in provides for a in alts):
                          out.append(" | ".join(alts))
              return out


          for r in REQUIRED:
              if r not in pkgs:
                  problems.append("paket %s tidak ada di status dpkg" % r)
              else:
                  for u in unmet(r):
                      problems.append("dependensi %s dari %s tidak terpenuhi" % (u, r))

          info = []
          for name in sorted(pkgs):
              if name in REQUIRED:
                  continue
              for u in unmet(name):
                  info.append("%s membutuhkan %s" % (name, u))
          print("Dependensi tidak terpenuhi pada paket lain (info saja): %d" % len(info))
          for line in info[:40]:
              print("  " + line)

          sl = Path("etc/apt/sources.list")
          if not sl.is_file():
              problems.append("etc/apt/sources.list tidak ada")
          else:
              active = [l for l in sl.read_text(encoding="utf-8").splitlines() if re.match(r"\s*deb\s", l)]
              if active:
                  problems.append("sources.list masih punya baris deb aktif: %s" % active)

          for pat in ("bin/proot", "bin/proot-distro", "bin/file", "lib/libtalloc.so*", "libexec/proot*"):
              print(("ADA   " if glob.glob(pat) else "TIDAK ") + pat)

          if problems:
              print("GAGAL penjaga paket tambahan:")
              for p in problems:
                  print("  - " + p)
              sys.exit(1)
          print("OK penjaga paket tambahan")
          PYV

      - name: Unggah log build
        if: ${{ always() && inputs.build }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Unggah zip bootstrap (sementara, bukan rilis)
        if: ${{ always() && inputs.build }}
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64-uji
          path: |
            bootstrap-aarch64.zip
            bootstrap-aarch64.zip.sha256
          retention-days: 3
          if-no-files-found: ignore

      - name: Publikasikan ke release repo
        if: ${{ inputs.build && inputs.release }}
        run: |
          TAG="bootstrap-molina-$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" bootstrap-aarch64.zip bootstrap-aarch64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Bootstrap $NEW_PKG ($TAG)" \
            --notes "Bootstrap aarch64 untuk prefix $NEW_PKG. Sumber: $TP_REPO @ $TP_COMMIT"
          echo "RELEASE_TAG=$TAG"
          echo "URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/bootstrap-aarch64.zip"
          cat bootstrap-aarch64.zip.sha256
