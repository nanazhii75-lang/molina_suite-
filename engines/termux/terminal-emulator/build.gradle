// molina-suite: dimodifikasi dari upstream termux-app v0.118.3.
// Versi asli ada di riwayat git (commit "vendor: termux-app v0.118.3").
plugins {
    id "com.android.library"
}

android {
    namespace "com.molina.suite.terminal.terminal"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion project.property("ndkVersion")

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.withType(Test) {
    testLogging {
        events "started", "passed", "skipped", "failed"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
